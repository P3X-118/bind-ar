---
- name: Check existence of BIND systemd service
  ansible.builtin.stat:
    path: "{{ sysd_docker_service_path }}/{{ bind_identifier }}.service"
  register: bind_service_stat

- name: Uninstall BIND systemd services and files
  when: bind_service_stat.stat.exists | bool
  block:
    - name: Ensure BIND systemd service is stopped
      ansible.builtin.service:
        name: "{{ bind_identifier }}"
        state: stopped
        enabled: false
        daemon_reload: true

    - name: Ensure BIND systemd service does not exist
      ansible.builtin.file:
        path: "{{ sysd_docker_service_path }}/{{ bind_identifier }}.service"
        state: absent

    - name: Ensure BIND container network does not exist via community.docker.docker_network
      when: sysd_docker_net_creation_method == 'ansible-module'
      community.docker.docker_network:
        name: "{{ bind_container_network }}"
        state: absent

    - name: Ensure BIND container network does not exist via ansible.builtin.command
      when: sysd_docker_net_creation_method == 'command'
      ansible.builtin.command:
        cmd: >-
          {{ sysd_docker_host_command }} network rm
          {{ bind_container_network }}
      register: network_deletion_result
      changed_when: bind_container_network in network_deletion_result.stdout

    - name: Ensure BIND path does not exist
      ansible.builtin.file:
        path: "{{ bind_base_path }}"
        state: absent
